version: '3.8'

services:
  sharingan-gateway:
    build: ./sharingan-gateway
    ports:
      - "8000:8000"

  amaterasu-soar:
    build: ./amaterasu-soar
    ports:
      - "8001:8001"

  dashboard-soc:
    build: ./dashboard-soc
    ports:
      - "8501:8501"
    depends_on:
      - sharingan-gateway
      - amaterasu-soar
